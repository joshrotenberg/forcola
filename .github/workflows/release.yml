name: Release

# Builds forcola_shim for every supported target, attaches the
# tarballs (plus .sha256 sidecars) to the GitHub Release for the tag,
# then publishes the hex package with the checksum file generated from
# those assets.
#
# Tags are created by release-please (release-please.yml), which
# dispatches this workflow at the new tag because GITHUB_TOKEN-created
# tags do not fire on-tag-push workflows. Pushing a v* tag by hand
# works the same way. A workflow_dispatch from a branch ref runs the
# build matrix only, as a dry run. The explicit publish_existing_tag input
# resumes Hex publishing from main after verifying the package sources
# match its tag and all release assets are present.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_existing_tag:
        description: "Resume Hex publishing for the current mix.exs version"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.ref_type == 'tag' || inputs.publish_existing_tag != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04

    defaults:
      run:
        working-directory: native/forcola_shim

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f 2)"
          fi
          artifact="forcola_shim-v${version}-${{ matrix.target }}.tar.gz"
          tar -czf "${artifact}" -C "target/${{ matrix.target }}/release" forcola_shim
          shasum -a 256 "${artifact}" > "${artifact}.sha256"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            native/forcola_shim/${{ steps.package.outputs.artifact }}
            native/forcola_shim/${{ steps.package.outputs.artifact }}.sha256

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            native/forcola_shim/${{ steps.package.outputs.artifact }}
            native/forcola_shim/${{ steps.package.outputs.artifact }}.sha256

  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: build
    if: >-
      ${{ always() &&
          ((github.ref_type == 'tag' && needs.build.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_existing_tag == true &&
            github.ref_name == 'main' && needs.build.result == 'skipped')) }}

    steps:
      - name: Check HEX_API_KEY is configured
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "${HEX_API_KEY}" ]; then
            echo "::error::HEX_API_KEY secret is not set. Add a hex.pm API key with write access under Settings > Secrets and variables > Actions, then re-run this job."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check tag matches mix.exs version
        if: github.ref_type == 'tag'
        run: |
          version="$(grep -o '@version "[^"]*"' mix.exs | head -1 | cut -d '"' -f 2)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::mix.exs version ${version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Verify existing release for Hex recovery
        if: inputs.publish_existing_tag == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -o '@version "[^"]*"' mix.exs | head -1 | cut -d '"' -f 2)"
          tag="v${version}"
          git fetch --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"

          # Test and workflow changes are fine; the package's inputs must
          # still be exactly the sources used for the tagged release.
          package_paths=(.formatter.exs mix.exs mix.lock lib guides README.md CHANGELOG.md LICENSE
            native/forcola_shim/src native/forcola_shim/Cargo.toml native/forcola_shim/Cargo.lock)
          if ! git diff --quiet "${tag}" HEAD -- "${package_paths[@]}"; then
            echo "::error::Package sources differ from ${tag}; cannot resume its Hex publish."
            git diff --name-only "${tag}" HEAD -- "${package_paths[@]}"
            exit 1
          fi

          assets="$(gh release view "${tag}" --json assets --jq '.assets[].name')"
          for target in aarch64-apple-darwin x86_64-apple-darwin \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            archive="forcola_shim-${tag}-${target}.tar.gz"
            for name in "${archive}" "${archive}.sha256"; do
              if ! printf '%s\n' "${assets}" | grep -Fxq "${name}"; then
                echo "::error::Missing ${name} on release ${tag}."
                exit 1
              fi
            done
          done

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      # Compiling from a git checkout (no checksum file yet) takes the
      # cargo build path of the :forcola_shim compiler.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: mix deps.get

      # Runs before the checksum file exists, so the shim is built from
      # source at this tag rather than downloaded.
      - name: Run tests
        run: mix test

      # Downloads the tarballs the build jobs just attached to the
      # release and writes the gitignored checksum-forcola_shim.exs
      # that ships in the hex package.
      - name: Generate checksum file
        run: mix forcola.checksum

      - name: Publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
